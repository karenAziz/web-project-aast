<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AASTMT Admin - Settings</title>
    <link rel="stylesheet" href="Settings.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>AASTMT Admin</h2>
        </div>
        <ul class="nav-links">
            <li><a href="tDashboard.html">Dashboard</a></li>
            <li><a href="tManageCourses.html">Manage Courses</a></li>
            <li><a href="tReports.html">Reports</a></li>
            <li><a href="Settings.html" class="active">Settings</a></li>
            <li><a href="tProfile.html">Profile</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="logout">Logout</a>
        </div>
    </nav>

    <main class="content">
        <header class="page-header">
            <h1>Account Settings</h1>
            <p>Manage your profile information and security preferences.</p>
        </header>

        <div class="settings-container">
            <section class="settings-card">
                <div class="card-header">
                    <h3>Personal Information</h3>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" value=" Name">
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" value="email@example.com">
                    </div>
                    <button class="btn-primary">Save Changes</button>
                </div>
            </section>

            <section class="settings-card">
                <div class="card-header">
                    <h3>Security & Password</h3>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <label>Current Password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" placeholder="Enter new password">
                    </div>
                    <button class="btn-primary">Update Password</button>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
