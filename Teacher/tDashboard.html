<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AASTMT Admin - Teacher Dashboard</title>
    <link rel="stylesheet" href="tDashboard.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>AASTMT Admin</h2>
        </div>
        <ul class="nav-links">
            <li><a href="tDashboard.html" class="active">Dashboard</a></li>
            <li><a href="tManageCourses.html">Manage Courses</a></li>
            <li><a href="tReports.html">Reports</a></li>
            <li><a href="Settings.html">Settings</a></li>
               <li><a href="tProfile.html">Profile</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="../index.html" class="logout">Logout</a>
        </div>
    </nav>

    <main class="content">
        
        <header class="page-header">
            <h1>Teacher Dashboard</h1>
            <p>Welcome back! Here is an overview of your academic activities.</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <span class="label">Total Students</span>
                <div class="value">124</div>
            </div>
            <div class="stat-card">
                <span class="label">Active Courses</span>
                <div class="value">4</div>
            </div>
            <div class="stat-card">
                <span class="label">Pending Assignments</span>
                <div class="value">18</div>
            </div>
            <div class="stat-card">
                <span class="label">Average Grade</span>
                <div class="value">88%</div>
            </div>
        </section>

        <section class="table-container">
            <div class="table-header">
                <h3>Today's Schedule</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>COURSE NAME</th>
                        <th>TIME</th>
                        <th>ROOM</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody>
                   
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
