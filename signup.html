<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | AASTMT Success Hub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo">
          <h1 class="logo-text">AASTMT</h1>
          <span class="logo-subtitle">Success Hub</span>
        </div>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="aboutus.html" class="nav-link">About Us</a></li>
          <li><a href="Courses.php" class="nav-link">Courses</a></li>
          <li><a href="login.html" class="nav-link btn-login">Login</a></li>
          <li><a href="signup.html" class="nav-link btn-signup">Signup</a></li>
        </ul>
</div>
</nav>

    <div class="photo">
      <img
        src="/web-project-aast/imgs/sign-up-form-button-graphic-concept_53876-133556.avif"
        alt="Signup Photo"
        style="max-width: 100%; border-radius: 8px"
      />
    </div>

    <form method="post" action="/web-project-aast/admin/signup.php">
      <div class="signup-container">
        <div class="signup-form">
          <h1>Create Your Account</h1>

          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="emails"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="passwords"
              placeholder="Enter a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmpassword">Confirm Password</label>
            <input
              type="password"
              id="confirmpassword"
              name="confirmpasswords"
              placeholder="Confirm your password"
              required
            />
          </div>

          <button type="submit" class="signup-btn">Sign Up</button>

          <p class="login-link">
            Already have an account? <a href="login.html">Login here</a>
          </p>
        </div>
      </div>
    </form>
  </body>
</html>
